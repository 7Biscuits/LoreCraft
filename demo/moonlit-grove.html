        keys.add(b.dataset.key.toLowerCase());
      };
      b.onpointerup = b.onpointercancel = () =>
        keys.delete(b.dataset.key.toLowerCase());
    }
    function loop(t) {
      accumulator += Math.min(0.1, (t - last) / 1000 || 0);
      last = t;
      while (accumulator >= 1 / 60) {
        if (!paused)
          engine.step({
            x:
              Number(keys.has("d") || keys.has("arrowright")) -
              Number(keys.has("a") || keys.has("arrowleft")),
            y:
              Number(keys.has("s") || keys.has("arrowdown")) -
              Number(keys.has("w") || keys.has("arrowup")),
            dash: keys.has("shift"),
            action: keys.has(" "),
          });
        accumulator -= 1 / 60;
      }
      engine.draw(ctx, 960, 560);
      if (paused) {
        ctx.fillStyle = "#08121d99";
        ctx.fillRect(0, 0, 960, 560);
        ctx.fillStyle = "#e7e9e5";
        ctx.font = "24px Georgia";
        ctx.textAlign = "center";
        ctx.fillText("Paused · click to continue", 480, 280);
      }
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</html>
